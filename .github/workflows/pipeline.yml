name: Tourism Project Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register dataset
        run: python tourism_project/model_building/data_register.py
      - uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  data-preparation:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data
      - name: Prepare data
        run: python tourism_project/model_building/prep.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error

  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow_server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done
          cat mlflow_server.log
          exit 1
      - name: Train and track experiments
        run: python tourism_project/model_building/train.py
      - name: Check model loading for deployment
        run: python tourism_project/hosting/hosting.py
      - name: Save experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-evidence
          path: |
            tourism_project/reports/
            mlruns/
            mlflow_server.log
          retention-days: 30
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_package_model_v1.joblib
          git add tourism_project/reports/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update trained tourism model [skip ci]"
            git push origin HEAD:main
          fi
